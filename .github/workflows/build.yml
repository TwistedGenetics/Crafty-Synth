# SPDX-License-Identifier: GPL-3.0-only
# Crafty Synth firmware build (after FM1-Chord's and DREADNOUGHT's). Every push / PR builds the firmware and runs the tests.
# Releases: the version is in the VERSION file (X.Y; the FM-1 package identity is FM-1_9XXYY00, X0X's scheme).
# A push to main publishes the Release vX.Y with Crafty-Synth-X.Y.fwsc if it doesn't exist yet; once it does, later
# pushes leave it alone (work in progress never replaces a published file: bump VERSION for the next one). Running
# this workflow on a vX.Y tag (or pushing one) rebuilds that Release's files from the tag; so does pushing a branch
# rebuild-vX.Y made of that release's commit plus this workflow file. The flasher site is then redeployed.
#
# Crafty Synth's own app, engine and arp-seq on X0X's platform (the x0x-firmware submodule, pinned), built the way
# DREADNOUGHT and Carnac OS build (tools/build_fm1.py). See docs/UPSTREAM.md.
name: build

on:
  push:
    branches: [main, "rebuild-v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (the font, the measurements)
        run: pip install Pillow fonttools numpy

      - name: Cache JieLi toolchain and SDK files
        uses: actions/cache@v4
        with:
          path: ~/.fm1craft-deps
          key: jieli-deps-${{ runner.os }}-${{ hashFiles('tools/get_deps.sh') }}

      - name: Toolchain and SDK files
        run: tools/get_deps.sh ~/.fm1craft-deps

      - name: Read the version
        id: ver
        run: |
          v=$(tr -d ' \n' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF_NAME}" in rebuild-v*) [ "${GITHUB_REF_NAME}" = "rebuild-v$v" ] || { echo "::error title=Version::branch ${GITHUB_REF_NAME}, but VERSION says $v"; exit 1; } ;; esac
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error title=Version::tag ${GITHUB_REF_NAME}, but VERSION says $v"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Host tests (the engine measured, the app on a simulated panel, the editor and flasher)
        run: sh tests/run_host.sh

      - name: Build the firmware package (with the start-up preflight and the miscompile check)
        run: |
          set -o pipefail
          if ! python3 tools/build_fm1.py --release "${{ steps.ver.outputs.version }}" 2>&1 | tee build.log; then
            msg=$(grep -E "error|FAIL|Error" build.log | head -30; echo ---; tail -25 build.log)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=firmware build::$msg"
            exit 1
          fi

      - name: The update loader cut off at every point of an install (DREADNOUGHT 0.43's test)
        run: |
          set -o pipefail
          core=x0x-firmware/build/crafty/ldr_fw/loader/ldr_core.c
          cc -O2 -std=c99 -Wall -Wextra -Werror -Wno-unused-function -Wno-unused-parameter \
            -DLDR_CORE="\"../../$core\"" tests/host/ldr_cut_test.c -o build/ldr_cut_test
          if ! build/ldr_cut_test "build/fm1/Crafty-Synth-${{ steps.ver.outputs.version }}.fwsc" 2>&1 | tee ldr.log; then
            echo "::error title=update loader::$(grep -E 'FAIL' ldr.log | head -5 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=Update loader::$(tail -4 ldr.log | head -3 | tr '\n' ' ')"

      - name: Collect the package
        run: |
          mkdir -p dist
          pkg="build/fm1/Crafty-Synth-${{ steps.ver.outputs.version }}.fwsc"
          name="Crafty-Synth-${{ steps.ver.outputs.version }}.fwsc"
          cp "$pkg" "dist/$name"
          cp build/fm1/sizes.md build/fm1/sizes.json dist/ 2>/dev/null || true
          cd dist
          sha256sum *.fwsc > SHA256SUMS
          python3 - "$name" <<'EOF'
          import sys, hashlib
          d = open(sys.argv[1], "rb").read()
          ident = "".join(chr((d[i * 0x30 + 0x2F] - i - 1) & 0xFF) for i in range(20) if d[i * 0x30 + 0x2F] != 0x7D)
          print(f"::notice title=package::{sys.argv[1]} identity {ident}, {len(d)} bytes, sha256 {hashlib.sha256(d).hexdigest()[:16]}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ github.sha }}
          path: |
            build/host/*.png
            build/host/*.wav
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The editor's engine (the firmware's C as WebAssembly)
        run: |
          pip install numpy
          command -v wasm-ld >/dev/null || sudo apt-get install -y lld
          sh tools/build_wasm.sh
      - name: Editor and flasher tests
        run: node --test web/flasher/test/*.test.mjs web/editor/test/*.test.mjs

  # -------------------------------------------------------------------------------------------------------------
  # The AU / VST3 plugin and standalone app (macOS, Apple Silicon and Intel), after the FM-1 has built: the same
  # engine, so a change that breaks the FM-1 never ships in a plugin.
  plugin-mac:
    needs: firmware
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (the wavetables)
        run: pip install numpy
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: ~/juce-8.0.4
          key: juce-8.0.4-${{ runner.os }}-${{ runner.arch }}
      - name: JUCE 8.0.4
        run: |
          [ -d ~/juce-8.0.4/modules ] || git clone -q --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE ~/juce-8.0.4
      - name: The plugin's own test (no host, no window)
        run: |
          set -o pipefail
          cmake -S ports/plugin -B build/plugin-test -DCMAKE_BUILD_TYPE=Release -DCRAFTY_JUCE_DIR=$HOME/juce-8.0.4 -DCRAFTY_TESTS_ONLY=ON >/dev/null
          cmake --build build/plugin-test -j 4 2>&1 | tail -20
          build/plugin-test/CraftyPluginTest_artefacts/Release/CraftyPluginTest
      - name: Build AU, VST3 and the standalone app (universal)
        run: |
          set -o pipefail
          cmake -S ports/plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DCRAFTY_JUCE_DIR=$HOME/juce-8.0.4 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build/plugin --config Release -j 4 2>&1 | grep -E "error|warning: |Linking|Built target" | tail -40
          ls build/plugin/CraftySynth_artefacts/Release
      - name: Sign (ad hoc) and check
        run: |
          A=build/plugin/CraftySynth_artefacts/Release
          for b in "$A/AU/Crafty Synth.component" "$A/VST3/Crafty Synth.vst3" "$A/Standalone/Crafty Synth.app"; do
            codesign --force --deep --sign - "$b"
            lipo -archs "$b/Contents/MacOS/Crafty Synth"
          done
      - name: pluginval (VST3) and auval (AU)
        run: |
          set -o pipefail
          A=build/plugin/CraftySynth_artefacts/Release
          curl -sSL -o /tmp/pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q /tmp/pv.zip -d /tmp/pv
          /tmp/pv/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --timeout-ms 300000 --validate "$A/VST3/Crafty Synth.vst3" 2>&1 | tail -40
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/Crafty Synth.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu CrSy TwGn 2>&1 | tail -25
      - name: Package
        run: |
          v=$(tr -d ' \n' < VERSION)
          A=build/plugin/CraftySynth_artefacts/Release
          mkdir -p pkg/Crafty-Synth-$v-mac dist
          cp -R "$A/AU/Crafty Synth.component" "$A/VST3/Crafty Synth.vst3" "$A/Standalone/Crafty Synth.app" pkg/Crafty-Synth-$v-mac/
          cp ports/plugin/INSTALL.txt pkg/Crafty-Synth-$v-mac/
          (cd pkg && ditto -c -k --keepParent Crafty-Synth-$v-mac ../dist/Crafty-Synth-$v-mac.zip)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-mac-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  # -------------------------------------------------------------------------------------------------------------
  # The MPC plugin, after the FM-1 has built: Gen1 MPCs and the Force (armv7: MPC One / One Retro, Live, Live II, X,
  # Key 61; glibc 2.31, so MPC OS 2.x and 3.x load it) and Gen2 MPCs (aarch64: MPC Live III and kin, MPC OS 3.x).
  # The community toolkit's VST2 wrapper (external/mpc-vst-plugins) around the same engine, its offline host test
  # (x86, and arm64 under QEMU), the libraries and the skin, packaged for the MPC plugin installer: one zip each.
  mpc:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install numpy Pillow
      - name: params.json and layout.conf in step with the engine
        run: python3 ports/mpc/make_port.py --check
      - name: The toolkit's offline test (the VST2 calls MPC makes, under ASan/UBSan)
        run: bash external/mpc-vst-plugins/tools/test_port.sh ports/mpc/vst.json
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: The toolkit's offline test on arm64 (Gen2's CPU, under QEMU)
        run: bash external/mpc-vst-plugins/tools/test_port.sh ports/mpc/vst.json aarch64
      - name: Build the plugin (armv7 for Gen1, aarch64 for Gen2) and the skin
        run: |
          set -o pipefail
          bash external/mpc-vst-plugins/tools/build_port.sh ports/mpc/vst.json all 2>&1 | grep -v "overlap by" | tail -30
          for SO in ports/mpc/build/craftysynth.so ports/mpc/build/aarch64/craftysynth.so; do
            file "$SO"
            exported=$(readelf --dyn-syms -W "$SO" | grep -E ' GLOBAL .* [0-9]+ [A-Za-z]' | grep -v UND | awk '{print $8}' | tr '\n' ' ')
            [ "$exported" = "VSTPluginMain " ] || { echo "::error::$SO exports $exported"; exit 1; }
            glibc=$(readelf -V "$SO" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "::notice title=MPC plugin::$SO: $(stat -c %s "$SO") bytes, highest glibc $glibc"
          done
      - name: Skin preview
        run: |
          mkdir -p dist preview
          python3 external/mpc-vst-plugins/tools/studio.py preview \
            "ports/mpc/build/skin/Twisted Genetics - VST - Crafty Synth/Plugin Skins" -o preview/page_%d.png >/dev/null
      - name: "Package (the MPC plugin installer's zips, Gen1 and Gen2)"
        run: |
          v=$(tr -d ' \n' < VERSION)
          for arch in armv7 aarch64; do
          so=ports/mpc/build/craftysynth.so
          if [ $arch = aarch64 ]; then so=ports/mpc/build/aarch64/craftysynth.so; fi
          python3 external/mpc-vst-plugins/tools/release.py \
            --so $so \
            --skin "ports/mpc/build/skin/Twisted Genetics - VST - Crafty Synth" \
            --entry ports/mpc/build/pluginlist-entry.xml \
            --version "$v.0" \
            --repo TwistedGenetics/Crafty-Synth --license GPL-3.0-only --id crafty-synth \
            --about "Crafty Synth: the M-VAVE FM-1's CRAFTsynth-style wavetable synth as an MPC plugin." \
            -o out-$arch
          mv out-$arch/*.zip "dist/Crafty-Synth-$v-mpc-$arch.zip"
          python3 external/mpc-vst-plugins/tools/catalog_check.py "dist/Crafty-Synth-$v-mpc-$arch.zip" --catalog \
            --expect-id crafty-synth --expect-repo TwistedGenetics/Crafty-Synth || echo "::warning::catalog check $arch (listing only)"
          done
          ls -l dist
      - name: The official MPC OS 3.10.1+ package (Akai's MPC Plugin SDK, one folder for every MPC)
        run: |
          set -o pipefail
          v=$(tr -d ' \n' < VERSION)
          SDK=external/mpc-plugin-builder-sdk/tools
          python3 $SDK/legacy_convert.py "dist/Crafty-Synth-$v-mpc-armv7.zip" "dist/Crafty-Synth-$v-mpc-aarch64.zip" \
            --out official --zip 2>&1 | tail -10
          python3 $SDK/validate.py "official/Twisted Genetics - VST - Crafty Synth" 2>&1 | tail -30
          cat "official/Twisted Genetics - VST - Crafty Synth/plugin.json"
          mv official/*-mpc.zip "dist/Crafty-Synth-$v-mpc.zip"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: mpc-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mpc-skin-preview-${{ github.sha }}
          path: preview/

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/heads/rebuild-v')
    needs: [firmware, web, plugin-mac, mpc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: plugin-mac-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mpc-${{ github.sha }}
          path: dist
      - name: Checksums (every file)
        run: cd dist && sha256sum *.fwsc *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Version
        id: ver
        run: |
          v=$(tr -d ' \n' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: "Already published? From main a release is never rebuilt from later code"
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = main ] && gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::${{ steps.ver.outputs.tag }} is published already: left as it is"
          fi
      - name: Publish release
        if: steps.have.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Crafty Synth ${{ steps.ver.outputs.version }} beta
          make_latest: true
          files: |
            dist/Crafty-Synth-${{ steps.ver.outputs.version }}.fwsc
            dist/Crafty-Synth-${{ steps.ver.outputs.version }}-mac.zip
            dist/Crafty-Synth-${{ steps.ver.outputs.version }}-mpc.zip
            dist/Crafty-Synth-${{ steps.ver.outputs.version }}-mpc-armv7.zip
            dist/Crafty-Synth-${{ steps.ver.outputs.version }}-mpc-aarch64.zip
            dist/SHA256SUMS
          body: |
            Crafty Synth — a CRAFTsynth 2.0-style monophonic wavetable synth for the **M-VAVE FM-1**: 8 oscillators, 16 oscillator modifiers, spread into unison or chords, a morphing filter, three envelopes, two LFOs, an 8-slot mod matrix, glide, distortion, delay and a sequenced arpeggiator. 64 presets; your own wavetables from Serum / Vital WAVs.

            **Beta: not yet tested on a real FM-1.** Installing custom firmware is at your own risk. Read [RECOVERY.md](https://github.com/${{ github.repository }}/blob/main/docs/RECOVERY.md) before you install.

            **Install:** open the [web flasher](https://twistedgenetics.github.io/Crafty-Synth/flasher/) in Chrome or Edge with the FM-1 on USB, back up, and pick this release (or download `Crafty-Synth-${{ steps.ver.outputs.version }}.fwsc` and choose the file).

            **Also as plugins, the same engine:** `Crafty-Synth-${{ steps.ver.outputs.version }}-mac.zip` (AU / VST3 / standalone, macOS) and `Crafty-Synth-${{ steps.ver.outputs.version }}-mpc.zip` (every MPC and the Force on MPC OS 3.10.1+, Akai's official External Plugin Support: unzip into a "VST2 Plugins" folder), plus `-mpc-armv7.zip` / `-mpc-aarch64.zip` for the community MPC plugin installer. Install notes: [docs/PORTS.md](https://github.com/${{ github.repository }}/blob/main/docs/PORTS.md). Built and tested in CI; not yet tried in a DAW or on an MPC.

            **Editor:** [twistedgenetics.github.io/Crafty-Synth/editor](https://twistedgenetics.github.io/Crafty-Synth/editor/). Manual: [docs/MANUAL.md](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL.md). What's new: [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
      - name: Redeploy the flasher site (lists this release)
        if: steps.have.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
